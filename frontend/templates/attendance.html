<!DOCTYPE html>
<html>
<head>
    <title>Attendance</title>
    <link rel="stylesheet" href="/static/css/style.css?v=1.1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <h2>SmartBoard</h2>
            <a href="/">🏠 Dashboard</a>
            <a href="/attendance">📸 Attendance</a>
            <a href="/reports">📊 Reports</a>
        </div>

        <div class="main">
            <h1>Mark Attendance</h1>

            <div class="container"> <div class="view-toggle">
                    <button onclick="switchView('list')">📋 List View</button>
                    <button onclick="switchView('grid')">⬛ Grid View</button>
                    <button onclick="startCamera()" style="background: #28a745;">📷 Start Auto-Attendance</button>
                </div>

                <div id="listView">
                    <table id="studentsTable">
                        <thead>
                            <tr>
                                <th>Roll</th>
                                <th>Name</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div id="gridView" class="grid-container" style="display:none;"></div>

            </div> </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
